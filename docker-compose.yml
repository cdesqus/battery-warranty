# Production Docker Compose for Presales Monitoring System

version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: presales-postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: presales_db
    ports:
      - "5433:5432" # Allows external connections for DB inspection/management
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Automatically run schema definition and data seeding on first startup
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d presales_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Backend Express API Service
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: presales-backend-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: presales_db
    depends_on:
      db:
        condition: service_healthy # Wait for DB healthcheck to pass before booting API

  # 3. Frontend Web Client (served by Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: presales-frontend-web
    restart: always
    ports:
      - "80:80" # Maps production web port 80
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
